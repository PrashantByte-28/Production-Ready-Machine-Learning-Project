name: Test ECR

on:
  push:
    branches:
      - main

jobs:
  test-ecr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Check AWS account
        run: |
          aws sts get-caller-identity

      - name: Check ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names visa \
            --region ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Test ECR push
        run: |
          docker pull hello-world
          docker tag hello-world 891376917319.dkr.ecr.ap-south-1.amazonaws.com/visa:test
          docker push 891376917319.dkr.ecr.ap-south-1.amazonaws.com/visa:test