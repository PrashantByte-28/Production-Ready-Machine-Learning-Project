    <section class="hero">
        <h1>US Visa Prediction</h1>
        <p class="hero-sub">An employment-visa outcome estimate, built from your case details.</p>
    </section>

    <section>
        <div class="container-fluid">
            <div class="container">

                <!-- Live completion tracker (display only, reads existing fields, changes nothing about them) -->
                <div class="tracker" aria-hidden="true">
                    <div class="tracker-track"><div class="tracker-fill" id="trackerFill"></div></div>
                    <span class="tracker-label"><span id="trackerCount">0</span>/8 fields complete</span>
                </div>

                <div class="formBox">
                    <p class="card-kicker">Application form</p>
                    <form action="/" method="post">
                        <legend>US Visa approval Form</legend>

                        <p class="section-tab">Applicant</p>
                        <div class="field-grid">
                            <div class="inputBox">
                                <select class="form-control input" id="continent" name="continent" placeholder="Continent" required="required">
                                  <option value="" disabled selected>Select Continent</option>
                                  <option>Asia</option>
                                  <option>Africa</option>
                                  <option>North America</option>
                                  <option>Europe</option>
                                  <option>South America</option>
                                  <option>Oceania</option>
                                </select>
                                <label for="continent" class="inputText">Continent</label>
                              </div>

                              <div class="inputBox">
                                <select class="form-control input" id="education_of_employee" name="education_of_employee" placeholder="Education" required="required">
                                    <option value="" disabled selected>Select Education</option>
                                    <option>High School</option>
                                    <option>Master's</option>
                                    <option>Bachelor's</option>
                                    <option>Doctorate</option>
                                </select>
                                <label for="education_of_employee" class="inputText">Education of employee</label>
                              </div>
                        </div>

                        <p class="section-tab">Employment</p>
                        <div class="field-grid">
                              <div class="inputBox">
                                <select class="form-control input" id="has_job_experience" name="has_job_experience" placeholder="Has Experience" required="required">
                                    <option value="" disabled selected>Has Experience</option>
                                    <option>N</option>
                                    <option>Y</option>
                                </select>
                                <label for="has_job_experience" class="inputText">Has job experience</label>
                              </div>

                              <div class="inputBox">
                                <select class="form-control input" id="requires_job_training" name="requires_job_training" placeholder="Training required" required="required">
                                    <option value="" disabled selected>Required Training</option>
                                    <option>N</option>
                                    <option>Y</option>
                                </select>
                                <label for="requires_job_training" class="inputText">Requires job training</label>
                              </div>

                              <div class="inputBox">
                                <input type="number" class="form-control input range-fill" id="no_of_employees" name="no_of_employees" min="14500" max="40000" placeholder=" " required="required">
                                <label for="no_of_employees" class="inputText">Number of employees <span class="hint">(15,000&ndash;40,000)</span></label>
                              </div>

                              <div class="inputBox">
                                <select class="form-control input" id="region_of_employment" name="region_of_employment" placeholder="Region" required="required">
                                  <option value="" disabled selected>Region</option>
                                  <option>West</option>
                                  <option>Northeast</option>
                                  <option>South</option>
                                  <option>Midwest</option>
                                  <option>Island</option>
                                </select>
                                <label for="region_of_employment" class="inputText">Region of employment</label>
                              </div>
                        </div>

                        <p class="section-tab">Compensation</p>
                        <div class="field-grid">
                              <div class="inputBox">
                                <input type="number" class="form-control input range-fill" id="prevailing_wage" name="prevailing_wage" min="600" max="70000" placeholder=" " required="required">
                                <label for="prevailing_wage" class="inputText">Prevailing wage <span class="hint">(700&ndash;7,000)</span></label>
                              </div>

                              <div class="inputBox">
                                <select class="form-control input" id="unit_of_wage" name="unit_of_wage" placeholder="Contract tenure" required="required">
                                    <option value="" disabled selected>Contract Tenure</option>
                                    <option>Hour</option>
                                    <option>Year</option>
                                    <option>Week</option>
                                    <option>Month</option>
                                </select>
                                <label for="unit_of_wage" class="inputText">Contract tenure</label>
                              </div>

                              <div class="inputBox">
                                <select class="form-control input" id="full_time_position" name="full_time_position" placeholder="Full Time" required="required">
                                    <option value="" disabled selected>Full Time</option>
                                    <option>Y</option>
                                    <option>N</option>
                                </select>
                                <label for="full_time_position" class="inputText">Full or part time</label>
                              </div>

                              <div class="inputBox">
                                <input type="number" class="form-control input range-fill" id="company_age" name="company_age" min="15" max="180" placeholder=" " required="required">
                                <label for="company_age" class="inputText">Age of the company <span class="hint">(10&ndash;180 yrs)</span></label>
                              </div>
                        </div>

                        <input class="btn btn-primary button stamp-btn" type="submit" value="Predict Visa Status" required />

                    </form>
                </div>
            </div>

            <div class="result-wrap text-center text-black">
                <h2 class="display-4 fw-bolder">Visa Prediction Status: <span id="resultValue">{{context}}</span></h2>
            </div>
        </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.2.1.js"></script>
    <script type="text/javascript">
        $(".input").focus(function(){
            $(this).parent().addClass("focus");
        }).blur(function(){
            if($(this).val() === ''){
                $(this).parent().removeClass("focus");
            }
        })
    </script>

    <!-- Additional presentation-only interactivity. Does not touch field names, values, or form submission. -->
    <script type="text/javascript">
        (function(){
            // Pre-select the "focus" state for any field that already has a value
            // (e.g. browser autofill on reload), so its label stays floated correctly.
            $(".input").each(function(){
                if ($(this).val() !== '') { $(this).parent().addClass("focus"); }
            });

            // --- Live completion tracker ---
            var fields = $("#continent, #education_of_employee, #has_job_experience, #requires_job_training, #no_of_employees, #region_of_employment, #prevailing_wage, #unit_of_wage, #full_time_position, #company_age");
            var total = fields.length;

            function updateTracker(){
                var filled = 0;
                fields.each(function(){
                    var v = $(this).val();
                    if (v !== '' && v !== null && v !== undefined) filled++;
                });
                $("#trackerCount").text(filled);
                $("#trackerFill").css('width', (filled / total * 100) + '%');
            }
            fields.on('change input', updateTracker);
            updateTracker();

            // --- Subtle fill indicator on ranged number inputs ---
            $(".range-fill").each(function(){
                var el = $(this);
                var min = parseFloat(el.attr('min'));
                var max = parseFloat(el.attr('max'));
                function paint(){
                    var v = parseFloat(el.val());
                    var pct = isNaN(v) ? 0 : Math.min(100, Math.max(0, (v - min) / (max - min) * 100));
                    el.css('--fill', pct + '%');
                }
                el.on('input', paint);
                paint();
            });

            // --- Stamp-in animation for a real result, once the page has loaded ---
            var resultText = $("#resultValue").text().trim();
            if (resultText !== '' && resultText.indexOf('{{') === -1) {
                $(".result-wrap").addClass("has-result");
            }

            // --- Press ripple on the stamp button (visual only, does not block submit) ---
            $(".stamp-btn").on('click', function(){
                $(this).addClass('is-pressed');
            });
        })();
    </script>
  </body>
